services:
  db:
    image: postgres:16-alpine
    container_name: helpdesk_ti_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk123}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk_ti}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-helpdesk_ti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_ti_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk123}@db:5432/${POSTGRES_DB:-helpdesk_ti}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_helpdesk_ti_2026_change_in_prod}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helpdesk_ti_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
